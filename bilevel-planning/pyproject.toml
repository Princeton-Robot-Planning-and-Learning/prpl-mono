[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "bilevel_planning"
version = "0.1.3"
description = "Methods for robot planning with abstractions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
   "matplotlib",
   "numpy",
   "networkx",
   "types-networkx",
   "gymnasium",
   "flask",
   "flask-cors",
   "pillow",
]

[project.optional-dependencies]
develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["bilevel_planning.visualizer.frontend*"]

[tool.setuptools.package-data]
bilevel_planning = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*", "build", "dist", "third_party", "third-party", "__pycache__/", "src/bilevel_planning/visualizer/frontend/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*", "build", "dist", "third_party", "third-party", "__pycache__/", "src/bilevel_planning/visualizer/frontend/"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "pyperplan.*",
]
ignore_missing_imports = true
