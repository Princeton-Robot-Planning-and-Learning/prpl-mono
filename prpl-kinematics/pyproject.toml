[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "prpl_kinematics"
version = "0.0.2"
description = "Kinematics-only robot modeling, IK, motion planning, and manipulation primitives built on a general KinematicTree."
readme = "README.md"
# PEP 639 form. The bundled IKFast sources under third_party/ are Apache-2.0; see
# src/prpl_kinematics/third_party/ikfast/NOTICE.
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "src/prpl_kinematics/third_party/ikfast/LICENSE"]
requires-python = ">=3.10"
classifiers = [
   "Programming Language :: Python :: 3",
   "Operating System :: OS Independent",
]

# Lists only what the code imports.
dependencies = [
   # numpy 2 is supported (the suite passes on it); the optional ssik extra
   # requires numpy>=2, so the cap is not pinned below it.
   "numpy>=1.23.5",
   "scipy>=1.10",
   "prpl_utils>=0.0.1",
   "spatialmath-python>=1.1.10",
   "yourdfpy>=0.0.56",
   "trimesh>=4.0",
   "pybullet-arm64>=3.2.8",
   "imageio>=2.30",
   "eaik>=1.2.1",
]

[project.optional-dependencies]
# OMPL-backed motion planning (OMPLPlanner, seed_ompl). Kept optional because ompl
# publishes no sdist and wheels for far fewer platforms than everything else here --
# none for Windows, and macOS 15 or newer only -- so requiring it would narrow the
# whole package to those platforms. BiRRTPlanner needs nothing extra.
planning = ["ompl>=2.0.0"]
# Optional analytic IK backend (ssik); requires numpy>=2. See ik/ssik.py.
ssik = ["ssik[urdf]>=1.2"]
develop = [
    # Pulled in so that the OMPL tests still run in CI and in a dev install, even
    # though ompl is optional for users.
    "ompl>=2.0.0",
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2",
]

[project.urls]
Repository = "https://github.com/Princeton-Robot-Planning-and-Learning/prpl-mono"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Only py.typed is listed explicitly. The assets and third_party trees reach the
# distribution through setuptools-scm, which includes git-tracked files: globbing them
# from the filesystem instead would sweep in the gitignored IKFast build products
# (per-platform .so, .o, build/, __pycache__) left behind by a local compile. Shipping
# those breaks IKFast for everyone else, because _import_ikfast() compiles only when it
# finds no .so and would otherwise load one built for the wrong platform.
prpl_kinematics = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "third_party/*"

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*", "build", "dist", "third_party", "third-party", "__pycache__/"]
split_on_trailing_comma = true

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*", "build", "dist", "third_party", "third-party", "__pycache__/", "_blender_script.py"]

[[tool.mypy.overrides]]
module = [
    "pybullet.*",
    "pybullet_data.*",
    "pybullet_utils.*",
    "scipy.*",
    "spatialmath.*",
    "yourdfpy.*",
    "trimesh.*",
    "imageio.*",
    "eaik.*",
    "ompl.*",
    "ssik.*",
]
ignore_missing_imports = true
