name: CI Checks

on:
  push:
    branches: [main]  # Run all tests on main
  pull_request:       # Run selective tests on PRs

env:
  # Tell git/uv to NOT download LFS blobs, just keep pointer files
  GIT_LFS_SKIP_SMUDGE: "1"

  # Base SHA for selective testing in PRs
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

  # Run tests sequentially instead of in parallel
  SEQUENTIAL: "true"

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - name: Install LAPACK BLAS, OSMESA, and Eigen3
        # Eigen3 is needed by EAIK (analytic IK for the Dexmate Vega arm),
        # which is a sdist-only PyPI package that compiles from source.
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0 libeigen3-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run autoformat
        run: uv run ./run_in_affected_packages.sh "./run_autoformat.sh"

  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Install LAPACK BLAS, OSMESA, and Eigen3
        # Eigen3 is needed by EAIK (analytic IK for the Dexmate Vega arm),
        # which is a sdist-only PyPI package that compiles from source.
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0 libeigen3-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install pybullet-helpers Dexmate Vega extra (EAIK)
        # Pulls in EAIK so pylint can resolve the Vega IK imports rather than
        # reporting import-error. Requires the libeigen3-dev install above.
        run: |
          if [ -f pybullet-helpers/pyproject.toml ]; then
            cd pybullet-helpers
            uv pip install -e ".[dexmate-vega]"
            cd ..
          fi
      - name: Lint
        run: |
          uv run ./run_in_affected_packages.sh "pytest . --pylint -m pylint --pylint-rcfile=.pylintrc -p no:cacheprovider"

  static-type-checking:
    runs-on: ubuntu-latest
    steps:
      - name: Install LAPACK BLAS, OSMESA, and Eigen3
        # Eigen3 is needed by EAIK (analytic IK for the Dexmate Vega arm),
        # which is a sdist-only PyPI package that compiles from source.
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0 libeigen3-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Mypy
        run: |
          uv run ./run_in_affected_packages.sh "mypy . --no-incremental"

  visualizer-frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilevel-planning/src/bilevel_planning/visualizer/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bilevel-planning/src/bilevel_planning/visualizer/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install LAPACK BLAS, OSMESA, and Eigen3
        # Eigen3 is needed by EAIK (analytic IK for the Dexmate Vega arm),
        # which is a sdist-only PyPI package that compiles from source.
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0 libeigen3-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install pybullet-helpers Dexmate Vega extra (EAIK)
        # Pulls in EAIK so the Vega custom IK roundtrip test runs in CI rather
        # than being skipped. Until upstream EAIK ships binary wheels, this
        # step requires the libeigen3-dev install above.
        run: |
          if [ -f pybullet-helpers/pyproject.toml ]; then
            cd pybullet-helpers
            uv pip install -e ".[dexmate-vega]"
            cd ..
          fi
      - name: Pre-install IKFast modules
        run: |
          if [ -f pybullet-helpers/scripts/preinstall_ikfast.py ]; then
            echo "Pre-installing IKFast modules to avoid parallel test conflicts..."
            cd pybullet-helpers
            uv run python scripts/preinstall_ikfast.py
            cd ..
          fi
      - name: Pytest
        env:
          MUJOCO_GL: "osmesa"
          PYOPENGL_PLATFORM: ""
        run: |
          uv run ./run_in_affected_packages.sh "pytest --cache-clear tests/"
